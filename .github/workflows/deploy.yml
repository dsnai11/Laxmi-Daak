name: 🚀 Deploy to AWS EC2

# Auto deploy ab server khud karta hai (deploy/README.md dekhein).
# Ye workflow sirf Actions tab se manually chalta hai.
on:
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: 🔑 Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          script_stop: true
          script: |
            set -e
            cd /home/ubuntu/courier_app/courier_tracker

            echo "=== Pulling latest code from GitHub ==="
            git fetch origin main
            # Fast-forward only: fails (instead of overwriting) if someone edited files on the server
            git merge --ff-only origin/main
            git log --oneline -1

            echo "=== Installing dependencies ==="
            venv/bin/pip install -q -r requirements.txt

            echo "=== Restarting courier service ==="
            sudo systemctl restart courier.service

            echo "=== Health check ==="
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/login || true)
              if [ "$code" = "200" ]; then
                echo "HTTP Status: $code"
                echo "✅ Deployment complete!"
                exit 0
              fi
              sleep 2
            done
            echo "❌ App did not respond with 200 on /login (last status: $code)"
            sudo journalctl -u courier.service -n 40 --no-pager
            exit 1
